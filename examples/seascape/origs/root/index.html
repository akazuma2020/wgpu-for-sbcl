<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seascape WebGPU</title>

  <canvas id="gpu-canvas"></canvas>
  <div id="message"></div>
  <script type="module" src="./main.js"></script>
